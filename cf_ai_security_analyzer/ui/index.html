<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare AI Security Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cloudflare AI Security Analyzer</h1>
        <div class="input-section">
            <input type="text" id="urlInput" placeholder="Enter website URL (e.g., https://example.com)">
            <button id="analyzeButton">Analyze</button>
        </div>
        <div id="analysisOutput" class="output-section">
            <h2>Analysis Report</h2>
            <pre id="reportContent"></pre>
            <p id="noReportMessage">No analysis performed yet.</p>
        </div>
        <div class="chat-section">
            <h2>Chat with AI</h2>
            <div id="chatHistory" class="chat-history"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Ask a follow-up question...">
                <button id="chatButton">Send</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
